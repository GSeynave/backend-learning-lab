academy:
  name: Spring Backend Academy
  description: "${academy.name} Core Training"
  student: "${ACADEMY_STUDENT:anonymous}"
  lesson-duration: 60

  mode: development
  timeout: 10
  env-var:
    mode: yaml
    max-students: 10

  config:
    name: Spring Backend Academy
    lesson-duration: 60m
    max-students: 10

server:
  port: 8080

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/backend_learning
    username: backend_lab
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
